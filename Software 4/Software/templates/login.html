<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Folhas de estilo locais e bibliotecas externas (Bootstrap, Icons e Fontes) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='notificacoes.css') }}">

</head>

<body>

    <!-- Container principal centralizado para a tela de autenticação -->
    <div class="container d-flex align-items-center justify-content-center login-container">
        <div class="login-card text-start">

            <!-- Card lateral de apresentação e boas-vindas -->
            <div class="card-cad text-start mb-4">
                <img src="{{ url_for('static', filename='imagem/logo.png') }}" alt="HypeX" class="logo">

                <h4 class="mb-3 text-white">Seja Bem Vindo!</h4>
                <p class="mb-4 text-white">Acesse sua conta</p>
                <div class="mt-4 text-white" style="font-size: 13px">
                    © 2025 HYPE X - Sistema de Estoque.
                </div>
            </div>

            <!-- Formulário de autenticação de usuário -->
            <form method="POST">

                <div class="forms mb-3 text-start">
                    <h2>LOGIN</h2>

                    <!-- Campo: E-mail -->
                    <label class="form-label text-gray">Email</label>
                    <div class="input-group w-50">
                        <span class="input-group-text bg-dark border-secondary">
                            <i class="bi bi-envelope text-white"></i>
                        </span>
                        <input type="email" class="form-control" name="email" placeholder="Digite seu email" required>
                    </div>

                    <!-- Campo: Senha -->
                    <div class="mb-5 text-start">
                        <label class="form-label text-gray">Senha</label>
                        <div class="input-group w-50">
                            <span class="input-group-text bg-dark border-secondary">
                                <i class="bi bi-lock text-white"></i>
                            </span>
                            <input type="password" class="form-control" name="senha" placeholder="Digite sua senha"
                                required>
                        </div>
                    </div>

                    <!-- Botão de submissão -->
                    <button class="btn-login btn-primary w-50 text-white mt-0" type="submit">
                        Entrar
                    </button>

                    <!-- Link para recuperação de senha -->
                    <div class="login-links">
                        <div class="text-gray link-senha">
                            <a href="{{ url_for('esqueci_senha') }}" class="esqueci-senha">
                                Esqueci Minha Senha
                            </a>
                        </div>
                    </div>

                    <!-- Opção de permanência na sessão -->
                    <label class="manter-logado">
                        <input type="checkbox" name="lembrar">
                        Manter logado
                    </label>
                </div>

            </form>

            <!-- Links de autenticação social -->
            <div class="grid-login">
                <a href="#" class="bi bi-google text-gray"></a>
                <a href="#" class="bi bi-linkedin text-gray"></a>
                <a href="#" class="bi bi-apple text-gray"></a>
                <a href="#" class="bi bi-facebook text-gray"></a>
            </div>
        </div>

    </div>

    <!-- Script para ocultação e remoção automática de alertas da tela -->
    <script>
        setTimeout(() => {
            const alerts = document.querySelectorAll('.alert');
            alerts.forEach(alert => {
                alert.style.opacity = '0';
                setTimeout(() => alert.remove(), 500);
            });
        }, 3000);
    </script>

    <!-- Inclusão do componente reutilizável de notificações -->
    {% include '_notificacoes.html' %}

</body>

</html>
